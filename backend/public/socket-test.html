<!DOCTYPE html>
<html>
<head>
  <title>SanFoody Socket Test</title>
</head>
<body style="font-family: system-ui; padding: 20px; background: #FFF8F0;">
  <h1>🔌 SanFoody Socket Test</h1>
  
  <input id="tokenInput" placeholder="Paste JWT token here..." 
    style="width: 100%; max-width: 800px; padding: 10px; font-size: 14px;" />
  <br/><br/>
  <button onclick="connect()" style="padding: 10px 20px; background: #E63946; color: white; border: none; border-radius: 6px; cursor: pointer;">Connect</button>
  <button onclick="disconnect()" style="padding: 10px 20px; background: #666; color: white; border: none; border-radius: 6px; cursor: pointer;">Disconnect</button>
  
  <h3>📋 Logs:</h3>
  <div id="logs" style="background: #1F2937; color: #fff; padding: 12px; border-radius: 8px; font-family: monospace; max-height: 500px; overflow-y: auto;"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = null;

    function log(msg, type = 'info') {
      const logs = document.getElementById('logs');
      const entry = document.createElement('div');
      entry.style.color = type === 'success' ? '#4ade80' : type === 'error' ? '#f87171' : '#60a5fa';
      entry.style.padding = '4px 0';
      entry.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
      logs.appendChild(entry);
      logs.scrollTop = logs.scrollHeight;
      console.log(msg);
    }

    function connect() {
      const token = document.getElementById('tokenInput').value.trim();
      if (!token) { log('❌ Please paste a token', 'error'); return; }
      
      log('🔵 Connecting...');
      socket = io("http://localhost:5000", {
        auth: { token },
        transports: ['websocket', 'polling'],
      });

      socket.on("connect", () => log('✅ Connected! Socket ID: ' + socket.id, 'success'));
      socket.on("new-order", (data) => log('🔔 NEW ORDER: ' + JSON.stringify(data, null, 2), 'success'));
      socket.on("order-ready-for-pickup", (data) => log('🍽️ Order ready: ' + JSON.stringify(data), 'info'));
      socket.on("connect_error", (err) => log('❌ Error: ' + err.message, 'error'));
      socket.on("disconnect", (reason) => log('❌ Disconnected: ' + reason, 'error'));
    }

    function disconnect() {
      if (socket) { socket.disconnect(); socket = null; log('🔌 Manual disconnect'); }
    }
  </script>
</body>
</html>
