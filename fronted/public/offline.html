<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - SanFoody</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FDF8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1A1A1A;
      margin-bottom: 12px;
    }
    p {
      color: #6B5B4F;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #E63946, #F97316);
      color: white;
      border: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.02);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #6B5B4F;
    }
    .retry-btn {
      margin-top: 12px;
      background: transparent;
      border: 2px solid #E63946;
      color: #E63946;
      padding: 10px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: #E63946;
      color: white;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
      }
      h1 {
        color: #F5F0EB;
      }
      p {
        color: #A8988C;
      }
      .status {
        color: #A8988C;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      Looks like you've lost your internet connection.
      Don't worry — we'll save your progress and reconnect you.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="status">
      <span id="status-text">Waiting for connection...</span>
    </div>
    <button class="retry-btn" onclick="window.location.reload()">🔄 Retry Connection</button>
  </div>

  <script>
    // Update status when online
    window.addEventListener('online', () => {
      document.getElementById('status-text').textContent = '✅ Back online! Refreshing...';
      setTimeout(() => window.location.reload(), 1000);
    });

    window.addEventListener('offline', () => {
      document.getElementById('status-text').textContent = '❌ Still offline. Please check your connection.';
    });

    // Check initial status
    if (navigator.onLine) {
      document.getElementById('status-text').textContent = '✅ You\'re online!';
    }
  </script>
</body>
</html>
